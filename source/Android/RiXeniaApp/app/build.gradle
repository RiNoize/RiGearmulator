plugins { id 'com.android.application' }

// Explicitly bind the exact file populated by CI, not AGP's Android-user-home default.
def rixeniaKeystorePath = System.getenv('RIXENIA_KEYSTORE_PATH') ?: (System.getenv('HOME') + '/.android/debug.keystore')

def ciRunNumber = System.getenv('GITHUB_RUN_NUMBER')
def rixeniaVersionCode = ciRunNumber ? 10000 + ciRunNumber.toInteger() : 1

android {
    namespace 'com.rinoize.rixenia'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.rinoize.rixenia.v2'
        minSdk 26
        targetSdk 35
        versionCode rixeniaVersionCode
        versionName '0.1.2'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets { main { jniLibs.srcDirs = ['src/main/jniLibs'] } }
    signingConfigs {
        permanentV2 {
            if (rixeniaKeystorePath) storeFile file(rixeniaKeystorePath)
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.debug
        }
        release {
            debuggable false
            minifyEnabled false
            signingConfig signingConfigs.permanentV2
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
