plugins { id 'com.android.application' }

def ciRunNumber = System.getenv('GITHUB_RUN_NUMBER')
def rigearVersionCode = ciRunNumber ? 10000 + ciRunNumber.toInteger() : 10050

android {
    namespace 'com.rinoize.rigear'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.rinoize.rigear'
        minSdk 26
        targetSdk 35
        versionCode rigearVersionCode
        versionName '0.12.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets { main { jniLibs.srcDirs = ['src/main/jniLibs'] } }
    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.debug
        }
        release {
            debuggable false
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
