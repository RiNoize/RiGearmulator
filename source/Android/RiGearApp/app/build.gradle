plugins { id 'com.android.application' }

def ciRunNumber = System.getenv('GITHUB_RUN_NUMBER')
def rigearVersionCode = ciRunNumber ? 10000 + ciRunNumber.toInteger() : 10050
def rigearKeystorePath = System.getenv('RIGEAR_KEYSTORE_PATH')

android {
    namespace 'com.rinoize.rigear'
    compileSdk 35
    ndkVersion '27.2.12479018'
    signingConfigs {
        rigear {
            storeFile file(rigearKeystorePath ?: "${System.properties['user.home']}/.android/rigear-development.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    defaultConfig {
        applicationId 'com.rinoize.rigear'
        minSdk 26
        targetSdk 35
        versionCode rigearVersionCode
        versionName '0.12.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets { main { jniLibs.srcDirs = ['src/main/jniLibs'] } }
    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.rigear
        }
        release {
            debuggable false
            minifyEnabled false
            signingConfig signingConfigs.rigear
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
