plugins { id 'com.android.application' }

android {
    namespace 'com.rinoize.rigear'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.rinoize.rigear'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.8.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    // android-apk.yml builds all native code in Release before Gradle packages it.
    sourceSets { main { jniLibs.srcDirs = ['src/main/jniLibs'] } }
    buildTypes {
        debug { debuggable true }
        release {
            debuggable false
            minifyEnabled false
            signingConfig signingConfigs.debug // Direct-install test APK, not a production key.
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
