plugins { id 'com.android.application' }

// Same permanent V2 keystore as RiXenia/RiGear (CI decodes it into ~/.android/debug.keystore).
def riostirusKeystorePath = System.getenv('RIOSTIRUS_KEYSTORE_PATH') ?: (System.getenv('HOME') + '/.android/debug.keystore')
def ciRunNumber = System.getenv('GITHUB_RUN_NUMBER')
def riostirusVersionCode = ciRunNumber ? 10000 + ciRunNumber.toInteger() : 1

android {
    namespace 'com.rinoize.riostirus'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.rinoize.riostirus'
        minSdk 26
        targetSdk 35
        versionCode riostirusVersionCode
        versionName '0.2.2'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets { main { jniLibs.srcDirs = ['src/main/jniLibs'] } }
    signingConfigs {
        permanentV2 {
            if (riostirusKeystorePath) storeFile file(riostirusKeystorePath)
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { debuggable true; signingConfig signingConfigs.debug }
        release { debuggable false; minifyEnabled false; signingConfig signingConfigs.permanentV2 }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
