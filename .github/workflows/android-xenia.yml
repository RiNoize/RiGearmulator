name: RiXenia Android APK
on:
  workflow_dispatch:
  push:
    branches: [android-xenia]
    paths: ['.github/workflows/android-xenia.yml', 'CMakeLists.txt', 'source/**', '.gitmodules']
  pull_request:
    paths: ['.github/workflows/android-xenia.yml', 'source/Android/**', 'source/waldi/**', 'source/framework/**', 'source/cpu/**', 'source/CMakeLists.txt']
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: rixenia-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  RIXENIA_NDK_VERSION: '27.2.12479018'
  RIXENIA_BUILD_DIR: ${{ github.workspace }}/build/android-xenia-release
jobs:
  build-apk:
    name: RiXenia 0.2.0 ARM64 V2
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch pinned emulator cores
        run: git submodule update --init --recursive --depth 1 source/cpu/dsp56300 source/cpu/mc68k
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Source revision and Android changes
        run: |
          mkdir -p artifacts build/rixenia-tests
          git rev-parse HEAD > artifacts/source-revision.txt
          git submodule status --recursive >> artifacts/source-revision.txt
          git archive --format=zip HEAD source/Android/RiXeniaApp source/Android/rixeniaNative \
            source/Android/build-rixenia-native.sh source/Android/verify-rixenia.py source/waldi/common/wLib \
            source/waldi/xt/xtLib source/CMakeLists.txt .github/workflows/android-xenia.yml > artifacts/RiXenia-0.2.0-android-source.zip
      - name: Parser, output sizing, dispatch, SRC and lifecycle tests
        run: |
          JAVA_SRC=source/Android/RiXeniaApp/app/src/main/java/com/rinoize/rixenia
          javac -encoding UTF-8 -d build/rixenia-tests "$JAVA_SRC/BankFile.java" "$JAVA_SRC/PatchLibrary.java" \
            "$JAVA_SRC/AudioSizing.java" "$JAVA_SRC/RomFile.java" "$JAVA_SRC/RenderMeter.java" "$JAVA_SRC/AudioHealth.java" "$JAVA_SRC/XtParameters.java" source/Android/RiXeniaApp/tests/*Test.java
          python3 source/Android/RiXeniaApp/tests/check_editor_catalog.py | tee artifacts/editor-catalog.txt
          for test in BankFileTest AudioSizingTest RomFileTest AudioHealthTest XtParametersTest; do
            java -cp build/rixenia-tests "$test" | tee "artifacts/$test.txt"
          done
          for test in source/Android/RiXeniaApp/tests/*Test.cpp; do
            name="$(basename "$test" .cpp)"
            if [ "$name" = XeniaLifecycleTest ]; then continue; fi
            clang++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined \
              -I source/Android/rixeniaNative "$test" -o "build/rixenia-tests/$name"
            "build/rixenia-tests/$name" | tee "artifacts/$name.txt"
          done
          clang++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread -ffunction-sections -fdata-sections \
            -I source/framework -isystem source/cpu -isystem source/cpu/dsp56300/source -I source/waldi/common \
            source/Android/RiXeniaApp/tests/XeniaLifecycleTest.cpp source/waldi/common/wLib/wHardware.cpp \
            -Wl,--gc-sections -o build/rixenia-tests/XeniaLifecycleTest
          timeout 15s build/rixenia-tests/XeniaLifecycleTest | tee artifacts/XeniaLifecycleTest.txt
      - name: Require V2 signing identity; never cache the private key
        env:
          RIGEAR_SIGNING_KEY_BASE64_V2: ${{ github.event_name != 'pull_request' && secrets.RIGEAR_SIGNING_KEY_BASE64_V2 || '' }}
        run: |
          mkdir -p "$HOME/.android"
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 3072 -validity 365 -dname 'CN=RiXenia CI Only, O=RiNoize, C=AR'
            echo 'Signing source: ephemeral PR test key, not a distributable update' > artifacts/signing-source.txt
          else
            test -n "$RIGEAR_SIGNING_KEY_BASE64_V2" || { echo 'Missing RIGEAR_SIGNING_KEY_BASE64_V2; no random replacement key permitted.' >&2; exit 1; }
            printf '%s' "$RIGEAR_SIGNING_KEY_BASE64_V2" | base64 --decode > "$HOME/.android/debug.keystore"
            ACTUAL_CERT="$(keytool -exportcert -alias androiddebugkey -keystore "$HOME/.android/debug.keystore" -storepass android | openssl dgst -sha256 | awk '{print $2}')"
            test "$ACTUAL_CERT" = '30393306ce2796ea0effb1f199c0916c0cf7d2f2e88507c5a329e2f0f3e32775'
            echo 'Signing source: permanent repository secret V2' > artifacts/signing-source.txt
          fi
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Android SDK and Java API verification
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' "ndk;${RIXENIA_NDK_VERSION}"
          mkdir -p build/rixenia-java-api-check
          javac -encoding UTF-8 -source 17 -target 17 -cp "${ANDROID_HOME}/platforms/android-35/android.jar" \
            -d build/rixenia-java-api-check source/Android/RiXeniaApp/app/src/main/java/com/rinoize/rixenia/*.java
      - name: Optimized ARM64 Xenia engine
        run: |
          bash source/Android/build-rixenia-native.sh
          python3 source/Android/verify-rixenia.py native "${RIXENIA_BUILD_DIR}" --report artifacts/native-build.json
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Package RiXenia V2 APK
        working-directory: source/Android/RiXeniaApp
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Verify APK, signature and 16 KiB alignment
        run: |
          APK=artifacts/RiXenia-0.2.0-arm64.apk
          cp source/Android/RiXeniaApp/app/build/outputs/apk/release/app-release.apk "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$APK" > artifacts/apk-info.txt
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee artifacts/apk-signing.txt
          "${ANDROID_HOME}/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK" > artifacts/apk-alignment.txt
          python3 source/Android/verify-rixenia.py apk "$APK" --badging artifacts/apk-info.txt --report artifacts/apk-verification.json
          cp source/Android/RiXeniaApp/README.md artifacts/README-RiXenia.md
          echo '### RiXenia 0.2.0 ARM64 V2' >> "$GITHUB_STEP_SUMMARY"
          echo 'Updates RiXenia V2 0.1.2 in place; do not uninstall or clear app data.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Release build, host tests, signature and ELF alignment verified. Physical tablet validation pending.' >> "$GITHUB_STEP_SUMMARY"
      - name: Build UI-only emulator test APKs (no firmware or native ABI)
        working-directory: source/Android/RiXeniaApp
        run: gradle --no-daemon -PuiSmoke :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Android 35 touch and layout tests at tablet and compact densities
        run: bash source/Android/RiXeniaApp/tests/run-ui-smoke.sh
      - name: Upload APK, Android sources and reports
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: RiXenia-0.2.0-arm64
          path: artifacts/
          retention-days: 90
          if-no-files-found: error
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RiXenia-0.2.0-build-diagnostics
          path: artifacts/
          retention-days: 90
          if-no-files-found: warn
