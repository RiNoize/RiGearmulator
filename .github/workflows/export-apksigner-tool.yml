name: Export Android apksigner

on:
  workflow_dispatch:
  push:
    branches: [android-rigear]
    paths: ['.github/workflows/export-apksigner-tool.yml']

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install official Android build tools
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'build-tools;35.0.0'
          test -f "${ANDROID_HOME}/build-tools/35.0.0/lib/apksigner.jar"
          mkdir -p export
          cp "${ANDROID_HOME}/build-tools/35.0.0/lib/apksigner.jar" export/
          java -cp export/apksigner.jar com.android.apksigner.ApkSignerTool --help >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: official-apksigner-35
          path: export/apksigner.jar
          if-no-files-found: error
