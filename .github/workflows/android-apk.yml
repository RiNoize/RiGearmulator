name: RiGear Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-rigear
    paths:
      - ".github/workflows/android-apk.yml"
      - "CMakeLists.txt"
      - "source/**"
      - ".gitmodules"

permissions:
  contents: read

env:
  NDK_VERSION: "27.2.12479018"

jobs:
  build-apk:
    name: RiGear debug APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout RiGearmulator
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "${SDKMANAGER}"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;${NDK_VERSION}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build RiGear APK
        working-directory: source/Android/RiGearApp
        shell: bash
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload RiGear APK
        uses: actions/upload-artifact@v4
        with:
          name: RiGear-0.4-realtime-arm64
          path: source/Android/RiGearApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
