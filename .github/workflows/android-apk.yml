name: RiGear Android APK

on:
  workflow_dispatch:
  push:
    branches: [android-rigear]
    paths: ['.github/workflows/android-apk.yml', 'CMakeLists.txt', 'source/**', '.gitmodules']
permissions:
  contents: read
concurrency:
  group: rigear-apk-${{ github.ref }}
  cancel-in-progress: true
env:
  NDK_VERSION: '27.2.12479018'
  NATIVE_BUILD: build/android-release
  RIGEAR_KEYSTORE_PATH: ${{ runner.temp }}/rigear-signing.keystore
  RIGEAR_CERT_SHA256: 'a945b140b5debca52bb00fd78d83332aebdb7f92b0865408a68c13ef500dbbca'
jobs:
  build-apk:
    name: RiGear 0.12 Neon UI ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore cached permanent signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/rigear-development.keystore
          key: rigear-permanent-signing-v1
      - name: Bind permanent signing identity explicitly
        env:
          RIGEAR_SIGNING_KEY_BASE64: ${{ secrets.RIGEAR_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" artifacts
          CACHE_KEY="$HOME/.android/rigear-development.keystore"
          if [ -n "$RIGEAR_SIGNING_KEY_BASE64" ]; then
            printf '%s' "$RIGEAR_SIGNING_KEY_BASE64" | base64 --decode > "$RIGEAR_KEYSTORE_PATH"
            echo 'Signing source: permanent repository secret' | tee artifacts/signing-source.txt
          elif [ -f "$CACHE_KEY" ]; then
            cp "$CACHE_KEY" "$RIGEAR_KEYSTORE_PATH"
            echo 'Signing source: restored permanent cache' | tee artifacts/signing-source.txt
          else
            echo 'RIGEAR_SIGNING_KEY_BASE64 is missing and no permanent cache exists.' >&2
            exit 1
          fi
          chmod 600 "$RIGEAR_KEYSTORE_PATH"
          ACTUAL_CERT="$(keytool -exportcert -alias androiddebugkey -keystore "$RIGEAR_KEYSTORE_PATH" -storepass android | openssl dgst -sha256 | awk '{print $2}')"
          printf '%s\n' "$ACTUAL_CERT" | tee artifacts/expected-cert-sha256.txt
          test "$ACTUAL_CERT" = "$RIGEAR_CERT_SHA256"
          keytool -list -v -alias androiddebugkey -keystore "$RIGEAR_KEYSTORE_PATH" -storepass android > artifacts/keystore-info.txt
          cp "$RIGEAR_KEYSTORE_PATH" "$CACHE_KEY"
          chmod 600 "$CACHE_KEY"
      - name: Generate parameter catalog and integrate Neon UI
        run: |
          mkdir -p artifacts build/tests
          python3 source/Android/RiGearApp/tools/generate_studio_parameters.py | tee artifacts/catalog-and-ui-report.txt
          zip -qr artifacts/RiGear-0.12.0-source.zip source/Android/RiGearApp source/Android/rigearNative .github/workflows/android-apk.yml
      - name: Test sound library, favorites, persistence and macro bounds
        run: |
          JAVA_SRC=source/Android/RiGearApp/app/src/main/java/com/rinoize/rigear
          javac -encoding UTF-8 -d build/tests "$JAVA_SRC/SoundCodec.java" "$JAVA_SRC/SoundLibrary.java" source/Android/RiGearApp/tests/StudioLibraryTest.java
          java -cp build/tests StudioLibraryTest | tee artifacts/library-tests.txt
      - name: Test streaming converter, scope and diagnostics
        run: |
          clang++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I source/Android/rigearNative source/Android/RiGearApp/tests/ResamplerTest.cpp -o build/tests/resampler-test
          build/tests/resampler-test | tee artifacts/src-tests.txt
          JAVA_SRC=source/Android/RiGearApp/app/src/main/java/com/rinoize/rigear
          javac -d build/tests "$JAVA_SRC/RenderMeter.java" "$JAVA_SRC/PlaybackQueueMeter.java" "$JAVA_SRC/MeterWindow.java" "$JAVA_SRC/MidiTelemetry.java" \
            source/Android/RiGearApp/tests/RenderMeterTest.java source/Android/RiGearApp/tests/LatencyDiagnosticsTest.java
          java -cp build/tests RenderMeterTest | tee artifacts/tests.txt
          java -cp build/tests LatencyDiagnosticsTest | tee -a artifacts/tests.txt
          javac -d build/tests "$JAVA_SRC/ScopeBus.java" source/Android/RiGearApp/tests/ScopeBusTest.java
          java -cp build/tests ScopeBusTest | tee -a artifacts/tests.txt
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' "ndk;${NDK_VERSION}"
      - name: Compile Android API usage
        run: |
          mkdir -p build/java-api-check
          javac -encoding UTF-8 -source 17 -target 17 -cp "${ANDROID_HOME}/platforms/android-35/android.jar" \
            -d build/java-api-check source/Android/RiGearApp/app/src/main/java/com/rinoize/rigear/*.java
      - name: Configure optimized native engine
        run: |
          "${ANDROID_HOME}/cmake/3.22.1/bin/cmake" -S . -B "${NATIVE_BUILD}" -G Ninja \
            -DCMAKE_MAKE_PROGRAM="${ANDROID_HOME}/cmake/3.22.1/bin/ninja" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_HOME}/ndk/${NDK_VERSION}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_shared \
            -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
            -DBUILD_TESTING=OFF -Dgearmulator_BUILD_JUCEPLUGIN=OFF \
            -Dgearmulator_SYNTH_OSIRUS=ON -Dgearmulator_SYNTH_OSTIRUS=OFF \
            -Dgearmulator_SYNTH_VAVRA=OFF -Dgearmulator_SYNTH_XENIA=OFF \
            -Dgearmulator_SYNTH_NODALRED2X=OFF -Dgearmulator_SYNTH_JE8086=OFF \
            -Dgearmulator_SYNTH_88EMU=OFF -Dgearmulator_COMPONENT_DSPBRIDGE=OFF
      - name: Verify Release configuration
        run: |
          python3 - <<'PY'
          import json, pathlib, os
          path = pathlib.Path(os.environ['NATIVE_BUILD'])
          assert 'CMAKE_BUILD_TYPE:STRING=Release' in (path/'CMakeCache.txt').read_text()
          commands=json.loads((path/'compile_commands.json').read_text())
          checked=[]
          for suffix in ('virusLib/device.cpp','dsp56kEmu/dsp.cpp','rigearNative/RiGearStudio.cpp'):
              command=next(c['command'] for c in commands if c['file'].endswith(suffix))
              assert '-DNDEBUG' in command and '-O0' not in command
              assert any(flag in command for flag in ('-O2','-O3','-Ofast'))
              checked.append({'source':suffix,'command':command})
          pathlib.Path('artifacts/native-build.json').write_text(json.dumps({'version':'0.12.0','commit':os.environ['GITHUB_SHA'],'build':'Release','commands':checked},indent=2))
          print('Virus/DSP/Studio are optimized Release')
          PY
      - name: Build shared library
        run: |
          "${ANDROID_HOME}/cmake/3.22.1/bin/cmake" --build "${NATIVE_BUILD}" --target rigear_jni --parallel 2
          JNI_DIR=source/Android/RiGearApp/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$JNI_DIR"
          cp "${NATIVE_BUILD}/source/Android/rigearNative/librigear.so" "$JNI_DIR/"
          cp "${ANDROID_HOME}/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" "$JNI_DIR/"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Package Studio APK
        working-directory: source/Android/RiGearApp
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Verify packaged app and permanent certificate
        run: |
          APK=artifacts/RiGear-0.12.0-NeonUI-arm64.apk
          cp source/Android/RiGearApp/app/build/outputs/apk/release/app-release.apk "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$APK" > artifacts/apk-info.txt
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee artifacts/apk-signing.txt
          python3 - <<'PY'
          import zipfile, pathlib, json, re, os
          apk_path='artifacts/RiGear-0.12.0-NeonUI-arm64.apk'
          with zipfile.ZipFile(apk_path) as apk:
              assert 'lib/arm64-v8a/librigear.so' in apk.namelist()
              assert len(json.loads(apk.read('assets/studio-parameters.json'))) > 100
          info=pathlib.Path('artifacts/apk-info.txt').read_text()
          code=int(re.search(r"versionCode='(\d+)'", info).group(1))
          assert code >= 10000 and "versionName='0.12.0'" in info
          assert 'com.rinoize.rigear.StudioActivity' in info
          signing=pathlib.Path('artifacts/apk-signing.txt').read_text().lower()
          actual=re.search(r'signer #1 certificate sha-256 digest: ([0-9a-f]+)', signing).group(1)
          expected=pathlib.Path('artifacts/expected-cert-sha256.txt').read_text().strip().lower()
          assert actual == expected == os.environ['RIGEAR_CERT_SHA256']
          activity=pathlib.Path('source/Android/RiGearApp/app/src/main/java/com/rinoize/rigear/StudioActivity.java').read_text()
          audio=pathlib.Path('source/Android/RiGearApp/app/src/main/java/com/rinoize/rigear/RealtimeAudio.java').read_text()
          assert 'RiGear 0.12' in activity and 'private View fxPage()' in activity
          assert 'CATEGORÍA' in activity and 'ScopeBus.publish(block, rendered)' in audio
          assert pathlib.Path('source/Android/RiGearApp/app/src/main/java/com/rinoize/rigear/SynthDisplay.java').exists()
          manifest=pathlib.Path('source/Android/RiGearApp/app/src/main/AndroidManifest.xml').read_text()
          assert manifest.count('android:screenOrientation="sensorLandscape"') == 2
          print('Neon UI, live scope, category browser, explicit permanent certificate, rotation and ARM64 engine verified')
          PY
          sha256sum "$APK" > artifacts/apk-sha256.txt
          cp source/Android/RiGearApp/TESTING-0.12.md artifacts/
          echo '### RiGear 0.12 Neon Hardware UI' >> "$GITHUB_STEP_SUMMARY"
          echo 'Black/graphite-blue skin, live output LCD, tabbed editor, grouped FX and category library verified.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Gradle is explicitly bound to the permanent RiGear certificate; a mismatch fails CI.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Studio APK
        uses: actions/upload-artifact@v4
        with:
          name: RiGear-0.12.0-NeonUI-arm64
          path: artifacts/
          if-no-files-found: error
      - name: Upload sources and diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RiGear-0.12.0-build-diagnostics
          path: artifacts/
          if-no-files-found: warn
