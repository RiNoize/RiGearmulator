name: RiGear Android APK

on:
  workflow_dispatch:
  push:
    branches: [android-rigear]
    paths: ['.github/workflows/android-apk.yml', 'CMakeLists.txt', 'source/**', '.gitmodules']
permissions:
  contents: read
concurrency:
  group: rigear-apk-${{ github.ref }}
  cancel-in-progress: true
env:
  NDK_VERSION: '27.2.12479018'
  NATIVE_BUILD: build/android-release
jobs:
  build-apk:
    name: RiGear 0.11 Patch Browser ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate real parameter catalog and source snapshot
        run: |
          mkdir -p artifacts build/tests
          python3 source/Android/RiGearApp/tools/generate_studio_parameters.py | tee artifacts/catalog-report.txt
          git archive --format=zip HEAD source/Android/RiGearApp source/Android/rigearNative .github/workflows/android-apk.yml > artifacts/RiGear-0.11-source.zip
      - name: Test sound library, favorites, persistence and macro bounds
        run: |
          JAVA_SRC=source/Android/RiGearApp/app/src/main/java/com/rinoize/rigear
          javac -encoding UTF-8 -d build/tests "$JAVA_SRC/SoundCodec.java" "$JAVA_SRC/SoundLibrary.java" source/Android/RiGearApp/tests/StudioLibraryTest.java
          java -cp build/tests StudioLibraryTest | tee artifacts/library-tests.txt
      - name: Test unchanged streaming converter and diagnostics
        run: |
          clang++ -std=c++17 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I source/Android/rigearNative source/Android/RiGearApp/tests/ResamplerTest.cpp -o build/tests/resampler-test
          build/tests/resampler-test | tee artifacts/src-tests.txt
          JAVA_SRC=source/Android/RiGearApp/app/src/main/java/com/rinoize/rigear
          javac -d build/tests "$JAVA_SRC/RenderMeter.java" "$JAVA_SRC/PlaybackQueueMeter.java" "$JAVA_SRC/MeterWindow.java" "$JAVA_SRC/MidiTelemetry.java" \
            source/Android/RiGearApp/tests/RenderMeterTest.java source/Android/RiGearApp/tests/LatencyDiagnosticsTest.java
          java -cp build/tests RenderMeterTest | tee artifacts/tests.txt
          java -cp build/tests LatencyDiagnosticsTest | tee -a artifacts/tests.txt
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' "ndk;${NDK_VERSION}"
      - name: Compile Android API usage
        run: |
          mkdir -p build/java-api-check
          javac -encoding UTF-8 -source 17 -target 17 -cp "${ANDROID_HOME}/platforms/android-35/android.jar" \
            -d build/java-api-check source/Android/RiGearApp/app/src/main/java/com/rinoize/rigear/*.java
      - name: Configure optimized native engine
        run: |
          "${ANDROID_HOME}/cmake/3.22.1/bin/cmake" -S . -B "${NATIVE_BUILD}" -G Ninja \
            -DCMAKE_MAKE_PROGRAM="${ANDROID_HOME}/cmake/3.22.1/bin/ninja" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_HOME}/ndk/${NDK_VERSION}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_shared \
            -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
            -DBUILD_TESTING=OFF -Dgearmulator_BUILD_JUCEPLUGIN=OFF \
            -Dgearmulator_SYNTH_OSIRUS=ON -Dgearmulator_SYNTH_OSTIRUS=OFF \
            -Dgearmulator_SYNTH_VAVRA=OFF -Dgearmulator_SYNTH_XENIA=OFF \
            -Dgearmulator_SYNTH_NODALRED2X=OFF -Dgearmulator_SYNTH_JE8086=OFF \
            -Dgearmulator_SYNTH_88EMU=OFF -Dgearmulator_COMPONENT_DSPBRIDGE=OFF
      - name: Verify Release configuration
        run: |
          python3 - <<'PY'
          import json, pathlib, os
          path = pathlib.Path(os.environ['NATIVE_BUILD'])
          assert 'CMAKE_BUILD_TYPE:STRING=Release' in (path/'CMakeCache.txt').read_text()
          commands=json.loads((path/'compile_commands.json').read_text())
          checked=[]
          for suffix in ('virusLib/device.cpp','dsp56kEmu/dsp.cpp','rigearNative/RiGearStudio.cpp'):
              command=next(c['command'] for c in commands if c['file'].endswith(suffix))
              assert '-DNDEBUG' in command and '-O0' not in command
              assert any(flag in command for flag in ('-O2','-O3','-Ofast'))
              checked.append({'source':suffix,'command':command})
          pathlib.Path('artifacts/native-build.json').write_text(json.dumps({'version':'0.11.0','commit':os.environ['GITHUB_SHA'],'build':'Release','commands':checked},indent=2))
          print('Virus/DSP/Studio are optimized Release; existing 0.9 audio and SRC sources preserved')
          PY
      - name: Build shared library
        run: |
          "${ANDROID_HOME}/cmake/3.22.1/bin/cmake" --build "${NATIVE_BUILD}" --target rigear_jni --parallel 2
          JNI_DIR=source/Android/RiGearApp/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$JNI_DIR"
          cp "${NATIVE_BUILD}/source/Android/rigearNative/librigear.so" "$JNI_DIR/"
          cp "${ANDROID_HOME}/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" "$JNI_DIR/"
      - name: Keep a consistent development signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: rigear-development-signing-v1
      - name: Create development key when cache is empty
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=RiGear Development, O=RiNoize, C=AR'
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Package Studio APK
        working-directory: source/Android/RiGearApp
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Verify packaged app
        run: |
          cp source/Android/RiGearApp/app/build/outputs/apk/release/app-release.apk artifacts/RiGear-0.11-arm64.apk
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging artifacts/RiGear-0.11-arm64.apk > artifacts/apk-info.txt
          python3 - <<'PY'
          import zipfile, pathlib, json
          with zipfile.ZipFile('artifacts/RiGear-0.11-arm64.apk') as apk:
              assert 'lib/arm64-v8a/librigear.so' in apk.namelist()
              assert len(json.loads(apk.read('assets/studio-parameters.json'))) > 100
          info=pathlib.Path('artifacts/apk-info.txt').read_text()
          assert "versionCode='12'" in info and "versionName='0.11.0'" in info
          assert 'com.rinoize.rigear.StudioActivity' in info
          print('Studio launcher, real parameter catalog, ARM64 engine and APK version verified')
          ui = pathlib.Path('source/Android/RiGearApp/app/src/main/java/com/rinoize/rigear/StudioActivity.java').read_text()
          native = pathlib.Path('source/Android/rigearNative/RiGearStudio.cpp').read_text()
          assert 'StudioBridge.selectFactory' in ui and 'StudioBridge_selectFactory' in native
          assert 'BANK -' in ui and 'PATCH +' in ui and 'Bank '+chr(65) in ui
          print('Direct Factory Bank Select + Program Change browser wiring verified')
          PY
          cp source/Android/RiGearApp/TESTING-0.11.md artifacts/
          echo '### RiGear 0.11 Patch Browser' >> "$GITHUB_STEP_SUMMARY"
          echo 'Release verified; library/persistence/SysEx/SRC/MIDI tests and Java API compilation passed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Sound, Multi routing, tablet layout and long-session thermal behavior still require device testing.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Studio APK
        uses: actions/upload-artifact@v4
        with:
          name: RiGear-0.11-PatchBrowser-arm64
          path: artifacts/
          if-no-files-found: error
      - name: Upload sources and diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RiGear-0.11-build-diagnostics
          path: artifacts/
          if-no-files-found: warn
